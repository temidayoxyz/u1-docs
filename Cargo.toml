[workspace]
# The IME protocol harness is a workspace member rather than a feature of this
# crate, so nothing in the product's dependency graph can reference a webview.
members = ["spikes/ime-protocol"]

[package]
name = "u1-docs"
version = "0.0.0"
edition = "2024"
# ADR-0002: parley is verified against Rust 1.88+. Hold the same floor so the
# MSRV does not silently drift below what our text stack supports.
rust-version = "1.88"

description = "U1 Docs - a local-first word processor"
license = "GPL-3.0-or-later"
repository = "https://github.com/temidayoxyz/u1-docs"
homepage = "https://github.com/temidayoxyz/u1-docs"
readme = "README.md"
keywords = ["word-processor", "docx", "ooxml", "offline-first"]
categories = ["text-editors"]
publish = false

# Intentionally empty.
#
# ADR-0002 commits us to parley for inline text layout and ADR-0003 commits us
# to a webview shell. Neither dependency is added until the Phase 0 spike proves
# the approach works - see PLAN.md in the unsoftone repository.
#
# Adding crates speculatively is how a project ends up with a dependency tree it
# cannot explain and cannot remove. Prove first, then depend.
[dependencies]
# `complex-scripts` is NOT in parley's default features, and parley gates both
# its WordSegmenter and LineSegmenter behind it:
#
#     LineSegmenter::new_for_non_complex_scripts(opt)   <- without the feature
#     LineSegmenter::new(opt)                           <- with it
#
# Without it, CJK and Thai line breaking fail outright with
# "ICU4X data error: No segmentation model for complex script". Found by the
# Phase 0 spike; a word processor cannot ship without this.
parley = { version = "0.11.1", features = ["complex-scripts"] }

# parley declares its `complex-scripts` feature as empty and depends on
# icu_segmenter with `default-features = false`, which omits `auto`/`lstm` -
# the models that actually segment complex scripts. Cargo unifies features
# across the dependency graph for a given crate version, so declaring the same
# version here as a direct dependency is what actually turns the data on.
#
# This indirection is load-bearing. Do not "simplify" it away.
icu_segmenter = { version = "2.3", features = ["compiled_data", "auto"] }
unicode-segmentation = "1.13.3"
zip = "8.6.0"

# The IME protocol harness lives in its own crate at spikes/ime-protocol, not
# behind a feature here.
#
# A feature flag was the first attempt and it was wrong: `cargo clippy
# --all-features` in the default CI job switched the webview on, so the job
# needed webkit2gtk and the default build stopped being webview-free in
# practice while still appearing to be. A separate crate makes the boundary
# structural instead of conditional.
#
# It is also the honest shape: a throwaway validation harness should not be
# wired into the product crate at all. ADR-0003 is still PROVISIONAL, so
# nothing in the product dependency graph may reference a webview.
[dev-dependencies]

[profile.release]
# Office applications are layout- and I/O-bound, not compute-bound.
# Optimise for predictable frame times and build time, not raw throughput.
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
# Slower builds, much faster edit-compile cycles. Worth it for a project that
# will spend its life in the editor.
opt-level = 0
debug = 1
