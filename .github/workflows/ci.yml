name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref. Saves CI minutes and avoids reviewing
# stale output.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail the build on warnings. Relaxing this is how a quality bar quietly
  # disappears - see CONTRIBUTING.md.
  RUSTFLAGS: "-D warnings"

jobs:
  # Formatting is cheap, so it gets its own job and reports fast.
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # Fast feedback on the common failure modes, before the slower matrix job.
  lint-and-test:
    name: clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Do not cancel this matrix on one failure - a Linux-only failure is
      # exactly the kind of thing this job exists to catch.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # Linux: fontique's fontconfig backend links against the system
      # libfontconfig, which GitHub's runners do not provide. This is a real
      # build dependency of U1 Docs on Linux, not a CI quirk - packaging
      # (Phase 5) must depend on it too.
      - name: install Linux build + font dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev \
            fonts-noto-cjk \
            fonts-noto-devanagari \
            fonts-noto-thai \
            fonts-noto-core

      # The font-coverage tests skip themselves when a script has no installed
      # font, which keeps a minimal runner green but also means they would
      # silently test nothing. Installing Noto guarantees the CJK and Indic
      # coverage assertions actually execute on Linux.
      - name: report font availability
        run: |
          echo "Han/Noto fonts installed:" && fc-list | grep -ci 'noto.*cjk' || echo 0
          echo "Devanagari fonts installed:" && fc-list | grep -ci devanagari || echo 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: test
        run: cargo test --all-features -- --nocapture

  build-release:
    name: release build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
