name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref. Saves CI minutes and avoids reviewing
# stale output.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail the build on warnings. Relaxing this is how a quality bar quietly
  # disappears - see CONTRIBUTING.md.
  RUSTFLAGS: "-D warnings"

jobs:
  # Formatting is cheap, so it gets its own job and reports fast.
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # Fast feedback on the common failure modes, before the slower matrix job.
  lint-and-test:
    name: clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Do not cancel this matrix on one failure - a Linux-only failure is
      # exactly the kind of thing this job exists to catch.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # Linux: fontique's fontconfig backend links against the system
      # libfontconfig, which GitHub's runners do not provide. This is a real
      # build dependency of U1 Docs on Linux, not a CI quirk - packaging
      # (Phase 5) must depend on it too.
      #
      # Noto font package names vary across Ubuntu releases (a bare
      # fonts-noto-devanagari does not exist on noble), so availability is
      # probed with apt-cache and only what is actually present is installed.
      # A missing optional font must degrade the run, never fail it.
      - name: install Linux build + font dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev

          for pkg in fonts-noto-cjk fonts-noto-core fonts-noto-devanagari \
                     fonts-noto-thai fonts-indic fonts-lohit-deva fonts-thai-tlwg; do
            if apt-cache show "$pkg" >/dev/null 2>&1; then
              echo "installing $pkg"
              sudo apt-get install -y --no-install-recommends "$pkg"
            else
              echo "not available on this release, skipping: $pkg"
            fi
          done

      # The font-coverage tests skip themselves when a script has no installed
      # font, which keeps a minimal runner green but also means they would
      # silently test nothing. Report what is present so a skipped assertion is
      # visible in the log rather than quietly passing.
      #
      # Linux-only and `bash`-scoped on purpose: fc-list does not exist on
      # Windows, and PowerShell treats a non-zero exit from the pipeline as a
      # step failure.
      - name: report font availability
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set +e
          for script in han devanagari thai arabic; do
            count=$(fc-list :lang=$(echo "$script") family 2>/dev/null | sort -u | grep -c .)
            echo "fonts tagged [$script]: $count"
          done
          echo "total system families: $(fc-list : family | sort -u | grep -c .)"
          exit 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: test
        run: cargo test --all-features -- --nocapture

      # The IME harness is feature-gated, so nothing else builds it. On Linux it
      # additionally needs webkit2gtk. Compiling it here means the manual
      # protocol binary cannot rot while nobody is running it.
      - name: install webkit2gtk (Linux, for the IME harness)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev

      - name: build the IME protocol harness
        run: cargo build --features ime-protocol --bin ime_protocol

  build-release:
    name: release build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
